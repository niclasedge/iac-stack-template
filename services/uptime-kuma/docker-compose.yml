# Uptime monitoring dashboard. State (SQLite) lives in a named volume, so a
# redeploy keeps monitors and history. Host() must equal the resolved domain
# in services.yml (`status` + `example.com`).

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime-kuma.rule=Host(`status.example.com`)
      - traefik.http.routers.uptime-kuma.entrypoints=websecure
      - traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt
      - traefik.http.services.uptime-kuma.loadbalancer.server.port=3001
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  uptime-kuma-data:
