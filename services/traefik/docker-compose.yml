# Reverse proxy for edge-vps: Docker provider + Let's Encrypt (TLS-ALPN).
# Other stacks join the external `proxy` network and declare labels; nothing
# here needs editing when a service is added.
#
# Replace ACME_EMAIL below with an address you control before the first deploy.
# Certificates live in the named volume `traefik-acme`.

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=admin@example.com
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only watches containers, it never starts one.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - proxy

networks:
  proxy:
    name: proxy

volumes:
  traefik-acme:
