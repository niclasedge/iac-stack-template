[defaults]
# The committed example inventory. Real hosts go into inventory/inventory.yml
# (git-ignored); the justfile prefers that file and passes it with -i.
inventory = inventory/inventory.example.yml
host_key_checking = False
timeout = 30
remote_tmp = /tmp/.ansible/tmp
# yaml-formatted stdout via the built-in default callback.
stdout_callback = default
result_format = yaml
retry_files_enabled = False
deprecation_warnings = False
# Load-bearing, and not for the obvious reason: playbooks live in playbooks/,
# so Ansible's playbook-relative search looks in playbooks/roles/ and misses
# ansible/roles/. This relative path resolves against THIS FILE's directory,
# not against the working directory.
roles_path = roles

# es_logger callback: emits per-task spans and a job_run summary as JSON logs
# (trace_id via IAC_RUN_ID). The justfile exports ANSIBLE_CALLBACK_PLUGINS
# (absolute) so it also works from other working directories.
callback_plugins = ./callback_plugins
callbacks_enabled = es_logger

# sops_dotenv: reads one key out of an encrypted dotenv file on the controller.
# Same relative-path rule as roles_path.
lookup_plugins = lookup_plugins

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
